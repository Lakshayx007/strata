# Phase 2 labelling steps that need the database. Start from the Actions tab: "phase2" > "Run workflow".
#
#   recompute_mentions  rebuild the mentions table after a matcher change, log what moved, then print share of voice
#   sample              draw the chosen seed sample (or re-export the existing draw), print coverage and share of
#                       voice, and attach the sampled documents as a run artifact for the labelling pass
#   load_labels         load the committed label files: model_draft, claude_review and human, per sample
#   probe_category      count a proposed reason category's cue sentences across the corpus (category_probe.py)
#
# Uses the DATABASE_URL secret only.

name: phase2

on:
  workflow_dispatch:
    inputs:
      step:
        description: Which step to run
        type: choice
        default: sample
        options: [sample, recompute_mentions, load_labels, probe_category]
      sample:
        description: "sample only: which seed sample"
        type: choice
        default: seed_v2
        options: [seed_v1, seed_v2]
      redraw:
        description: "sample only: replace an existing draw"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest   # never overlaps an ingestion run
  cancel-in-progress: false

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Recompute mentions
        if: inputs.step == 'recompute_mentions'
        run: |
          python -m analysis.labeling.recompute_mentions
          python -m analysis.labeling.audit_mentions --entity snowflake
          python -m analysis.labeling.sample --sample seed_v1   # re-exports seed_v1 and prints share of voice

      - name: Draw seed sample
        if: inputs.step == 'sample'
        run: |
          python -m analysis.labeling.sample --sample ${{ inputs.sample }} ${{ inputs.redraw && '--redraw' || '' }}
          { echo '```'; cat data/processed/labeling/${{ inputs.sample }}_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sampled documents
        if: inputs.step == 'sample' || inputs.step == 'recompute_mentions'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.step == 'sample' && inputs.sample || 'recompute_mentions' }}
          path: data/processed/labeling/
          retention-days: 14

      - name: Probe a proposed category
        if: inputs.step == 'probe_category'
        run: python -m analysis.labeling.category_probe

      - name: Load labels
        if: inputs.step == 'load_labels'
        run: python -m analysis.labeling.load_labels
